<?xml version="1.0" encoding="UTF-8"?>
<!--
  '연구개발 차별화 전략' — 재제작 (2026-08-03).
  ⚠️ 검수 필요 등급: 높음. 현행 Concept 페이지에 이 항목의 설명 텍스트가 전혀 없어,
  Results에 문서화된 과제 특징 4가지(로봇팔 자동획득으로 숙련도 의존 해소 / 큐레이터
  요구사항 기반 UI/UX / 관계 네트워크·지식그래프 / 애셋 표준화)를 '차별화 전략'으로
  재구성한 것이다. 이는 원본의 복제가 아니라 재해석이므로 반드시 확인이 필요하다.
-->
<svg viewBox="0 0 1280 400" width="1280" height="400" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1280" height="400" fill="#111820"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">연구개발 차별화 전략</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <text x="40" y="92" font-size="11" letter-spacing="0.1em" fill="#93a4b3">기존 방식의 한계</text>
  <text x="660" y="92" font-size="11" letter-spacing="0.1em" fill="#35e0c4">CHIC의 접근</text>

  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="102" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="128" font-size="12" fill="#93a4b3">촬영자 숙련도에 따라 데이터 품질이 갈린다</text>
    <text x="58" y="150" font-size="10.5" fill="#93a4b3">시간과 노력이 많이 들고 결과가 일정하지 않음</text>
    <path d="M594 132 L646 132" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="102" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="128" font-size="12" font-weight="700" fill="#e6edf3">로봇팔 기반 자동 획득 장치</text>
    <text x="672" y="150" font-size="10.5" fill="#93a4b3">획득 과정을 표준화해 숙련도 의존을 제거</text>

    <rect x="40" y="176" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="202" font-size="12" fill="#93a4b3">기술자 중심 도구 — 큐레이터가 직접 못 씀</text>
    <text x="58" y="224" font-size="10.5" fill="#93a4b3">인문학 전공자가 접근하기 어려운 인터페이스</text>
    <path d="M594 206 L646 206" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="176" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="202" font-size="12" font-weight="700" fill="#e6edf3">큐레이터 요구사항 기반 UI/UX 설계</text>
    <text x="672" y="224" font-size="10.5" fill="#93a4b3">중앙박물관·무형유산원 학예사 요구를 직접 반영</text>

    <rect x="40" y="250" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="276" font-size="12" fill="#93a4b3">키워드 검색에 머무는 자료 탐색</text>
    <text x="58" y="298" font-size="10.5" fill="#93a4b3">유물 간 맥락과 연관성을 찾기 어려움</text>
    <path d="M594 280 L646 280" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="250" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="276" font-size="12" font-weight="700" fill="#e6edf3">관계 네트워크 · 지식그래프 기반 탐색</text>
    <text x="672" y="298" font-size="10.5" fill="#93a4b3">데이터속성 92종 · 관계 14종 정의로 맥락 검색 구현</text>

    <rect x="40" y="324" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="350" font-size="12" fill="#93a4b3">콘텐츠마다 데이터를 새로 만든다</text>
    <text x="58" y="372" font-size="10.5" fill="#93a4b3">재활용률이 낮아 제작 비용이 반복 발생</text>
    <path d="M594 354 L646 354" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="324" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="350" font-size="12" font-weight="700" fill="#e6edf3">애셋 표준화로 한 번 만들어 여러 번 활용</text>
    <text x="672" y="372" font-size="10.5" fill="#93a4b3">표준 스키마 · PBR 템플릿 30종 · 저작권 결합</text>
  </g>
</svg>
