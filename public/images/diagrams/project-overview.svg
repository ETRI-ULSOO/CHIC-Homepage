<?xml version="1.0" encoding="UTF-8"?>
<!--
  'CHIC 과제 개요' 다이어그램 — 먹빛 전시실 팔레트로 재제작 (2026-08-03).
  구조: 입력(문화유산 원천 데이터) → 4대 연구 축 → 산출(플랫폼·엔진) → 실증(2개 기관).
  내용 근거는 현행 /project 페이지의 연구내용·결과물 항목 (content-inventory.md §2.2).
  색은 토큰만 사용하며 범주는 위치로 구분한다 (DESIGN.md).
-->
<svg viewBox="0 0 1280 470" width="1280" height="470" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1280" height="470" fill="#111820"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">CHIC 과제 개요</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <!-- 입력 -->
  <rect x="40" y="96" width="170" height="230" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="56" y="124" font-size="13" font-weight="700" fill="#35e0c4">원천 데이터</text>
  <text x="56" y="152" font-size="11" fill="#93a4b3">· 2D 이미지</text>
  <text x="56" y="174" font-size="11" fill="#93a4b3">· 3D 스캔</text>
  <text x="56" y="196" font-size="11" fill="#93a4b3">· 텍스트 기록</text>
  <text x="56" y="218" font-size="11" fill="#93a4b3">· 동영상</text>
  <text x="56" y="248" font-size="10.5" fill="#93a4b3">국립중앙박물관</text>
  <text x="56" y="268" font-size="10.5" fill="#93a4b3">e-museum 아카이브</text>
  <text x="56" y="296" font-size="10.5" fill="#93a4b3">국립무형유산원 기록</text>

  <path d="M210 210 L248 210" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 4대 연구 축 -->
  <text x="256" y="88" font-size="11" letter-spacing="0.1em" fill="#93a4b3">4대 연구 축</text>
  <g>
    <rect x="256" y="96" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="272" y="122" font-size="12.5" font-weight="700" fill="#e6edf3">1. 데이터 획득·품질 개선</text>
    <text x="272" y="146" font-size="10.5" fill="#93a4b3">색상·노이즈·블러 개선, 초해상화</text>
    <text x="272" y="166" font-size="10.5" fill="#93a4b3">로봇팔 자동 획득, 품질 가이드라인</text>
    <text x="272" y="186" font-size="10.5" fill="#93a4b3">기가픽셀 2D · 초정밀 3D</text>

    <rect x="256" y="218" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="272" y="244" font-size="12.5" font-weight="700" fill="#e6edf3">2. 문화유산 애셋 기술</text>
    <text x="272" y="268" font-size="10.5" fill="#93a4b3">2D/3D 애셋 생성·변환</text>
    <text x="272" y="288" font-size="10.5" fill="#93a4b3">3D 가시화, 가상공간 전시</text>
    <text x="272" y="308" font-size="10.5" fill="#93a4b3">애셋 표준 스키마 · 저작권</text>

    <rect x="504" y="96" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="520" y="122" font-size="12.5" font-weight="700" fill="#e6edf3">3. 지능형 분석·검색</text>
    <text x="520" y="146" font-size="10.5" fill="#93a4b3">자동 분류·태깅, 개체명 인식</text>
    <text x="520" y="166" font-size="10.5" fill="#93a4b3">관계 네트워크 · 지식그래프</text>
    <text x="520" y="186" font-size="10.5" fill="#93a4b3">의미·비주얼 검색</text>

    <rect x="504" y="218" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="520" y="244" font-size="12.5" font-weight="700" fill="#e6edf3">4. 큐레이션 플랫폼</text>
    <text x="520" y="268" font-size="10.5" fill="#93a4b3">큐레이터 중심 UI/UX 설계</text>
    <text x="520" y="288" font-size="10.5" fill="#93a4b3">자연어 복합 검색, 애셋 공유</text>
    <text x="520" y="308" font-size="10.5" fill="#93a4b3">클라우드 저장 이원화</text>
  </g>

  <path d="M736 210 L774 210" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 산출 -->
  <rect x="782" y="96" width="228" height="230" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="798" y="124" font-size="13" font-weight="700" fill="#35e0c4">결과물</text>
  <text x="798" y="154" font-size="11" fill="#93a4b3">지능형 문화유산</text>
  <text x="798" y="174" font-size="11" fill="#93a4b3">통합 관리 플랫폼</text>
  <text x="798" y="196" font-size="10.5" fill="#93a4b3">— 인문학 전공 큐레이터가</text>
  <text x="798" y="214" font-size="10.5" fill="#93a4b3">직접 사용 가능</text>
  <text x="798" y="248" font-size="11" fill="#93a4b3">AI 기반 데이터</text>
  <text x="798" y="268" font-size="11" fill="#93a4b3">검색·분석 엔진</text>
  <text x="798" y="290" font-size="10.5" fill="#93a4b3">— 실감형 콘텐츠 제작용</text>

  <path d="M1010 210 L1048 210" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 실증 -->
  <rect x="1056" y="96" width="184" height="230" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="1072" y="124" font-size="13" font-weight="700" fill="#35e0c4">실증</text>
  <text x="1072" y="154" font-size="11" fill="#93a4b3">국립중앙박물관</text>
  <text x="1072" y="176" font-size="11" fill="#93a4b3">국립무형유산원</text>
  <text x="1072" y="208" font-size="10.5" fill="#93a4b3">AR/VR 시범 서비스</text>
  <text x="1072" y="228" font-size="10.5" fill="#93a4b3">웹 기반 박물관 콘텐츠</text>
  <text x="1072" y="248" font-size="10.5" fill="#93a4b3">관람객 반응 감지·추적</text>
  <text x="1072" y="280" font-size="10.5" fill="#93a4b3">MR 해설·체험 콘텐츠</text>

  <text x="40" y="368" font-size="10.5" fill="#93a4b3">수행기간: 2020.07 — 2022.12   |   문화체육관광부 문화기술 연구개발 지정과제</text>
  <text x="40" y="390" font-size="10.5" fill="#93a4b3">참여기관: ETRI · TRIC · SQI소프트 · 한국전통문화대학교 · 디캐릭   |   협력: 국립중앙박물관 · 국립무형유산원</text>
</svg>
