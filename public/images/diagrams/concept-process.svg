<?xml version="1.0" encoding="UTF-8"?>
<!--
  '실감콘텐츠 전시 프로세스' — 재제작 (2026-08-03).
  현행 Concept 페이지에는 이 항목의 설명 텍스트가 없다. 따라서 공정 단계는
  Results 페이지에 문서화된 2차년도 5개 대분류(획득·품질개선 → 애셋 → 분석·검색 →
  플랫폼 → 전시·체험)를 근거로 구성했다 (content-inventory.md §2.7).
  ※ 원본 다이어그램의 단계 구분과 다를 수 있으므로 검수 필요.
-->
<svg viewBox="0 0 1280 330" width="1280" height="330" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1280" height="330" fill="#111820"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">실감콘텐츠 전시 프로세스</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="124" font-size="11" fill="#35e0c4">STEP 1</text>
    <text x="58" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">데이터 획득</text>
    <text x="58" y="174" font-size="10.5" fill="#93a4b3">2D 기가픽셀 · 3D 스캔</text>
    <text x="58" y="194" font-size="10.5" fill="#93a4b3">로봇팔 자동 획득</text>

    <rect x="292" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="310" y="124" font-size="11" fill="#35e0c4">STEP 2</text>
    <text x="310" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">품질 개선</text>
    <text x="310" y="174" font-size="10.5" fill="#93a4b3">색상·노이즈·블러 개선</text>
    <text x="310" y="194" font-size="10.5" fill="#93a4b3">AI 초해상화</text>

    <rect x="544" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="562" y="124" font-size="11" fill="#35e0c4">STEP 3</text>
    <text x="562" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">애셋화</text>
    <text x="562" y="174" font-size="10.5" fill="#93a4b3">2D/3D 애셋 생성·변환</text>
    <text x="562" y="194" font-size="10.5" fill="#93a4b3">표준 스키마 · 저작권</text>

    <rect x="796" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="814" y="124" font-size="11" fill="#35e0c4">STEP 4</text>
    <text x="814" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">분석·검색</text>
    <text x="814" y="174" font-size="10.5" fill="#93a4b3">자동 태깅 · 관계 분석</text>
    <text x="814" y="194" font-size="10.5" fill="#93a4b3">의미·비주얼 검색</text>

    <rect x="1048" y="98" width="192" height="118" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="1066" y="124" font-size="11" fill="#35e0c4">STEP 5</text>
    <text x="1066" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">전시·체험</text>
    <text x="1066" y="174" font-size="10.5" fill="#93a4b3">AR/VR · 웹 콘텐츠</text>
    <text x="1066" y="194" font-size="10.5" fill="#93a4b3">관람객 반응 추적</text>
  </g>

  <path d="M252 157 L288 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M504 157 L540 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M756 157 L792 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M1008 157 L1044 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="40" y="240" width="1200" height="52" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="58" y="264" font-size="11" fill="#35e0c4">전 단계 관통</text>
  <text x="58" y="284" font-size="11" fill="#93a4b3">지능형 큐레이션 플랫폼 — 큐레이터가 각 단계의 결과를 직접 관리·검색·활용한다</text>
</svg>
