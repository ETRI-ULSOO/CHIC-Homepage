<?xml version="1.0" encoding="UTF-8"?>
<!--
  '연구개발의 필요성' 다이어그램 — 먹빛 전시실 팔레트로 재제작 (2026-08-03).
  현행 사이트의 파스텔 3색(청/주황/녹)은 시스템의 단일 악센트 원칙에 어긋나므로,
  세 범주를 색이 아니라 위치와 라벨로 구분한다. 악센트는 Mint 하나뿐이다.
  구조·문구는 현행 다이어그램 기준이며, 원본 확보 시 문구만 교정한다 (WORKLOG M-02).
-->
<svg viewBox="0 0 1280 470" width="1280" height="470" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1280" height="470" fill="#111820"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">CHIC 연구개발의 필요성</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="90" width="370" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="118" font-size="14" font-weight="700" fill="#35e0c4">현황 및 문제점</text>
    <text x="58" y="146" font-size="11" fill="#93a4b3">· 문화유산 디지털 데이터의 품질 편차와 표준 부재</text>
    <text x="58" y="168" font-size="11" fill="#93a4b3">· 취득자 숙련도에 따른 결과물 차이 발생</text>
    <text x="58" y="190" font-size="11" fill="#93a4b3">· 큐레이터가 직접 활용 가능한 도구의 부재</text>
    <text x="58" y="212" font-size="11" fill="#93a4b3">· 실감콘텐츠 제작 시 애셋 재활용률 저조</text>
  </g>

  <g>
    <rect x="455" y="90" width="370" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="473" y="118" font-size="14" font-weight="700" fill="#35e0c4">기술적 요구</text>
    <text x="473" y="146" font-size="11" fill="#93a4b3">· 고품질 2D/3D 문화유산 데이터 획득·변환</text>
    <text x="473" y="168" font-size="11" fill="#93a4b3">· AI 기반 의미·비주얼 검색 및 관계 분석</text>
    <text x="473" y="190" font-size="11" fill="#93a4b3">· 애셋 표준 스키마 및 저작권 관리</text>
    <text x="473" y="212" font-size="11" fill="#93a4b3">· 큐레이터 중심 UI/UX의 통합 플랫폼</text>
  </g>

  <g>
    <rect x="870" y="90" width="370" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="888" y="118" font-size="14" font-weight="700" fill="#35e0c4">기대 성과</text>
    <text x="888" y="146" font-size="11" fill="#93a4b3">· 지능형 문화유산 통합 관리 플랫폼 확보</text>
    <text x="888" y="168" font-size="11" fill="#93a4b3">· 실감형 체험콘텐츠 제작 기간·비용 절감</text>
    <text x="888" y="190" font-size="11" fill="#93a4b3">· 박물관·미술관 콘텐츠 진흥 기여</text>
    <text x="888" y="212" font-size="11" fill="#93a4b3">· 타 산업(의류·미디어) 확산 가능성</text>
  </g>

  <path d="M410 165 L455 165" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M825 165 L870 165" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="40" y="278" width="1200" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="58" y="306" font-size="14" font-weight="700" fill="#e6edf3">CHIC 연구개발 체계</text>
  <g font-size="10.5" fill="#93a4b3">
    <rect x="58" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="70" y="340" fill="#e6edf3">1. 문화유산 디지털 데이터</text><text x="70" y="356">획득 및 품질 개선</text>
    <rect x="300" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="312" y="340" fill="#e6edf3">2. 문화유산 애셋 기술</text><text x="312" y="356">(생성·변환·가시화·표준)</text>
    <rect x="542" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="554" y="340" fill="#e6edf3">3. 지능형 분석·검색</text><text x="554" y="356">가시화 기술</text>
    <rect x="784" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="796" y="340" fill="#e6edf3">4. 큐레이션 지원 및</text><text x="796" y="356">서비스 플랫폼</text>
    <rect x="1026" y="322" width="196" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="1038" y="340" fill="#e6edf3">5. 전시·체험</text><text x="1038" y="356">실증 서비스</text>
  </g>
  <text x="58" y="392" font-size="10.5" fill="#93a4b3">협력: 국립중앙박물관 · 국립무형유산원   |   수행기간: 2020.07 — 2022.12   |   문화체육관광부 문화기술 연구개발 지정과제</text>
  <text x="58" y="412" font-size="10.5" fill="#93a4b3">참여기관: ETRI · TRIC · SQI소프트 · 한국전통문화대학교 · 디캐릭</text>
</svg>
