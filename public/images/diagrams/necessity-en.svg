<?xml version="1.0" encoding="UTF-8"?>
<!-- English variant of necessity.svg. Keep geometry in sync with the Korean original. -->
<svg viewBox="0 0 1280 470" width="1280" height="470" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="470" fill="#111820"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">Why CHIC was needed</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="90" width="370" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="118" font-size="14" font-weight="700" fill="#35e0c4">Problems</text>
    <text x="58" y="146" font-size="11" fill="#93a4b3">· Uneven quality and no standard for digital heritage data</text>
    <text x="58" y="168" font-size="11" fill="#93a4b3">· Results vary with the operator's skill</text>
    <text x="58" y="190" font-size="11" fill="#93a4b3">· No tool curators can use directly</text>
    <text x="58" y="212" font-size="11" fill="#93a4b3">· Low asset reuse in immersive content production</text>
  </g>

  <g>
    <rect x="455" y="90" width="370" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="473" y="118" font-size="14" font-weight="700" fill="#35e0c4">Technical requirements</text>
    <text x="473" y="146" font-size="11" fill="#93a4b3">· High-quality 2D/3D acquisition and conversion</text>
    <text x="473" y="168" font-size="11" fill="#93a4b3">· AI semantic and visual search, relation analysis</text>
    <text x="473" y="190" font-size="11" fill="#93a4b3">· Asset schema standards and rights management</text>
    <text x="473" y="212" font-size="11" fill="#93a4b3">· An integrated, curator-centred UI/UX</text>
  </g>

  <g>
    <rect x="870" y="90" width="370" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="888" y="118" font-size="14" font-weight="700" fill="#35e0c4">Expected outcomes</text>
    <text x="888" y="146" font-size="11" fill="#93a4b3">· An integrated intelligent heritage platform</text>
    <text x="888" y="168" font-size="11" fill="#93a4b3">· Less time and cost for immersive content</text>
    <text x="888" y="190" font-size="11" fill="#93a4b3">· Support for museum and gallery content</text>
    <text x="888" y="212" font-size="11" fill="#93a4b3">· Transfer to other industries (fashion, media)</text>
  </g>

  <path d="M410 165 L455 165" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M825 165 L870 165" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="40" y="278" width="1200" height="150" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="58" y="306" font-size="14" font-weight="700" fill="#e6edf3">CHIC research structure</text>
  <g font-size="10.5" fill="#93a4b3">
    <rect x="58" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="70" y="340" fill="#e6edf3">1. Data acquisition</text><text x="70" y="356">and quality improvement</text>
    <rect x="300" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="312" y="340" fill="#e6edf3">2. Heritage asset technology</text><text x="312" y="356">(generate, convert, visualise)</text>
    <rect x="542" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="554" y="340" fill="#e6edf3">3. Intelligent analysis</text><text x="554" y="356">and search</text>
    <rect x="784" y="322" width="222" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="796" y="340" fill="#e6edf3">4. Curation support</text><text x="796" y="356">and service platform</text>
    <rect x="1026" y="322" width="196" height="42" rx="6" fill="#111820" stroke="#223140"/>
    <text x="1038" y="340" fill="#e6edf3">5. Exhibition and</text><text x="1038" y="356">experience validation</text>
  </g>
  <text x="58" y="392" font-size="10.5" fill="#93a4b3">Collaborating: National Museum of Korea · National Intangible Heritage Center   |   Period: Jul 2020 — Dec 2022   |   MCST Culture Technology R&amp;D</text>
  <text x="58" y="412" font-size="10.5" fill="#93a4b3">Partners: ETRI · TRIC · SQI Soft · NUCH · dcarrick</text>
</svg>
