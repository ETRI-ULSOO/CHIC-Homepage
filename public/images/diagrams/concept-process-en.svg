<?xml version="1.0" encoding="UTF-8"?>
<!-- English variant of concept-process.svg. Keep geometry in sync with the Korean original.
     Stage breakdown is derived from the Results categories — subject to review (M-11). -->
<svg viewBox="0 0 1280 330" width="1280" height="330" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="330" fill="#111820"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">Immersive content exhibition process</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="124" font-size="11" fill="#35e0c4">STEP 1</text>
    <text x="58" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">Acquisition</text>
    <text x="58" y="174" font-size="10.5" fill="#93a4b3">Gigapixel 2D · 3D scanning</text>
    <text x="58" y="194" font-size="10.5" fill="#93a4b3">Robotic arm capture</text>

    <rect x="292" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="310" y="124" font-size="11" fill="#35e0c4">STEP 2</text>
    <text x="310" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">Quality improvement</text>
    <text x="310" y="174" font-size="10.5" fill="#93a4b3">Colour, noise, deblurring</text>
    <text x="310" y="194" font-size="10.5" fill="#93a4b3">AI super-resolution</text>

    <rect x="544" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="562" y="124" font-size="11" fill="#35e0c4">STEP 3</text>
    <text x="562" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">Asset conversion</text>
    <text x="562" y="174" font-size="10.5" fill="#93a4b3">2D/3D asset generation</text>
    <text x="562" y="194" font-size="10.5" fill="#93a4b3">Schema · rights management</text>

    <rect x="796" y="98" width="212" height="118" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="814" y="124" font-size="11" fill="#35e0c4">STEP 4</text>
    <text x="814" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">Analysis &amp; search</text>
    <text x="814" y="174" font-size="10.5" fill="#93a4b3">Auto tagging · relation analysis</text>
    <text x="814" y="194" font-size="10.5" fill="#93a4b3">Semantic and visual search</text>

    <rect x="1048" y="98" width="192" height="118" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="1066" y="124" font-size="11" fill="#35e0c4">STEP 5</text>
    <text x="1066" y="150" font-size="12.5" font-weight="700" fill="#e6edf3">Exhibition</text>
    <text x="1066" y="174" font-size="10.5" fill="#93a4b3">AR/VR · web content</text>
    <text x="1066" y="194" font-size="10.5" fill="#93a4b3">Visitor response tracking</text>
  </g>

  <path d="M252 157 L288 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M504 157 L540 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M756 157 L792 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M1008 157 L1044 157" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="40" y="240" width="1200" height="52" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="58" y="264" font-size="11" fill="#35e0c4">ACROSS ALL STAGES</text>
  <text x="58" y="284" font-size="11" fill="#93a4b3">The intelligent curation platform — curators manage, search and reuse the output of each stage directly</text>
