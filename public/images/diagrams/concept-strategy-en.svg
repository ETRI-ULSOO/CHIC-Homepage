<?xml version="1.0" encoding="UTF-8"?>
<!-- English variant of concept-strategy.svg. Keep geometry in sync with the Korean original.
     ⚠️ HIGH review priority: the current site carries no explanatory text for this item, so the
     "limitation → CHIC approach" framing is a reconstruction, not a translation of an original. -->
<svg viewBox="0 0 1280 400" width="1280" height="400" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="400" fill="#111820"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">R&amp;D differentiation strategy</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <text x="40" y="92" font-size="11" letter-spacing="0.1em" fill="#93a4b3">LIMITS OF EXISTING PRACTICE</text>
  <text x="660" y="92" font-size="11" letter-spacing="0.1em" fill="#35e0c4">THE CHIC APPROACH</text>

  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="102" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="128" font-size="12" fill="#93a4b3">Data quality depends on the operator's skill</text>
    <text x="58" y="150" font-size="10.5" fill="#93a4b3">Slow, effortful, and inconsistent in outcome</text>
    <path d="M594 132 L646 132" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="102" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="128" font-size="12" font-weight="700" fill="#e6edf3">Robotic arm acquisition device</text>
    <text x="672" y="150" font-size="10.5" fill="#93a4b3">Standardises capture and removes the dependence on skill</text>

    <rect x="40" y="176" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="202" font-size="12" fill="#93a4b3">Engineer-facing tools curators cannot use</text>
    <text x="58" y="224" font-size="10.5" fill="#93a4b3">Interfaces hard to approach from a humanities background</text>
    <path d="M594 206 L646 206" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="176" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="202" font-size="12" font-weight="700" fill="#e6edf3">UI/UX designed from curator requirements</text>
    <text x="672" y="224" font-size="10.5" fill="#93a4b3">Requirements gathered directly from NMK and NIHC curators</text>

    <rect x="40" y="250" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="276" font-size="12" fill="#93a4b3">Search that stops at keywords</text>
    <text x="58" y="298" font-size="10.5" fill="#93a4b3">Context and connections between artefacts stay hidden</text>
    <path d="M594 280 L646 280" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="250" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="276" font-size="12" font-weight="700" fill="#e6edf3">Relation network and knowledge graph search</text>
    <text x="672" y="298" font-size="10.5" fill="#93a4b3">92 data attributes and 14 relation types defined for contextual search</text>

    <rect x="40" y="324" width="546" height="60" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="350" font-size="12" fill="#93a4b3">Data remade for every piece of content</text>
    <text x="58" y="372" font-size="10.5" fill="#93a4b3">Low reuse means production cost recurs each time</text>
    <path d="M594 354 L646 354" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a7)"/>
    <rect x="654" y="324" width="586" height="60" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
    <text x="672" y="350" font-size="12" font-weight="700" fill="#e6edf3">Standardised assets — make once, use many times</text>
    <text x="672" y="372" font-size="10.5" fill="#93a4b3">Standard schema · 30 PBR templates · rights data attached</text>
  </g>
</svg>
