<?xml version="1.0" encoding="UTF-8"?>
<!-- English variant of concept-platform.svg. Keep geometry in sync with the Korean original.
     The five items are those named in the platform definition on the current site. -->
<svg viewBox="0 0 1280 400" width="1280" height="400" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="400" fill="#111820"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">Intelligent curation platform</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <rect x="465" y="88" width="350" height="70" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
  <text x="485" y="114" font-size="11" letter-spacing="0.12em" fill="#35e0c4">AT THE CENTRE</text>
  <text x="485" y="140" font-size="13.5" font-weight="700" fill="#e6edf3">The experience the curator intends</text>

  <path d="M640 158 L640 186" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a5)"/>

  <text x="40" y="204" font-size="11" letter-spacing="0.1em" fill="#93a4b3">TAILORED INFORMATION DELIVERED BY AI</text>

  <g>
    <rect x="40" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">Heritage assets</text>
    <text x="58" y="264" font-size="10.5" fill="#93a4b3">In a form usable directly</text>
    <text x="58" y="284" font-size="10.5" fill="#93a4b3">in experience services</text>

    <rect x="284" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="302" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">Visual search</text>
    <text x="302" y="264" font-size="10.5" fill="#93a4b3">Semantic exploration and</text>
    <text x="302" y="284" font-size="10.5" fill="#93a4b3">related-item suggestions</text>

    <rect x="528" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="546" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">Previsualisation</text>
    <text x="546" y="264" font-size="10.5" fill="#93a4b3">Check the exhibition layout</text>
    <text x="546" y="284" font-size="10.5" fill="#93a4b3">before production</text>

    <rect x="772" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="790" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">Visitor tracking</text>
    <text x="790" y="264" font-size="10.5" fill="#93a4b3">Interactive response based</text>
    <text x="790" y="284" font-size="10.5" fill="#93a4b3">on detected reactions</text>

    <rect x="1016" y="212" width="224" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="1034" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">Rights</text>
    <text x="1034" y="264" font-size="10.5" fill="#93a4b3">Management of how far</text>
    <text x="1034" y="284" font-size="10.5" fill="#93a4b3">each asset may be used</text>
  </g>

  <rect x="40" y="330" width="1200" height="46" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="58" y="359" font-size="11" fill="#93a4b3">→ A heritage platform built on intelligent curation technology that delivers the above as tailored information</text>
</svg>
