<?xml version="1.0" encoding="UTF-8"?>
<!-- English variant of project-overview.svg. Keep geometry in sync with the Korean original. -->
<svg viewBox="0 0 1280 470" width="1280" height="470" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="470" fill="#111820"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">CHIC project overview</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <rect x="40" y="96" width="170" height="230" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="56" y="124" font-size="13" font-weight="700" fill="#35e0c4">Source data</text>
  <text x="56" y="152" font-size="11" fill="#93a4b3">· 2D imagery</text>
  <text x="56" y="174" font-size="11" fill="#93a4b3">· 3D scans</text>
  <text x="56" y="196" font-size="11" fill="#93a4b3">· Text records</text>
  <text x="56" y="218" font-size="11" fill="#93a4b3">· Video</text>
  <text x="56" y="248" font-size="10.5" fill="#93a4b3">National Museum of</text>
  <text x="56" y="268" font-size="10.5" fill="#93a4b3">Korea e-museum archive</text>
  <text x="56" y="296" font-size="10.5" fill="#93a4b3">NIHC records</text>

  <path d="M210 210 L248 210" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a2)"/>

  <text x="256" y="88" font-size="11" letter-spacing="0.1em" fill="#93a4b3">FOUR RESEARCH AXES</text>
  <g>
    <rect x="256" y="96" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="272" y="122" font-size="12.5" font-weight="700" fill="#e6edf3">1. Acquisition &amp; quality</text>
    <text x="272" y="146" font-size="10.5" fill="#93a4b3">Colour, noise, blur, super-resolution</text>
    <text x="272" y="166" font-size="10.5" fill="#93a4b3">Robotic acquisition, quality guidelines</text>
    <text x="272" y="186" font-size="10.5" fill="#93a4b3">Gigapixel 2D · ultra-precise 3D</text>

    <rect x="256" y="218" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="272" y="244" font-size="12.5" font-weight="700" fill="#e6edf3">2. Heritage assets</text>
    <text x="272" y="268" font-size="10.5" fill="#93a4b3">2D/3D asset generation, conversion</text>
    <text x="272" y="288" font-size="10.5" fill="#93a4b3">3D visualisation, virtual exhibition</text>
    <text x="272" y="308" font-size="10.5" fill="#93a4b3">Asset schema · rights management</text>

    <rect x="504" y="96" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="520" y="122" font-size="12.5" font-weight="700" fill="#e6edf3">3. Analysis &amp; search</text>
    <text x="520" y="146" font-size="10.5" fill="#93a4b3">Auto classification, tagging, NER</text>
    <text x="520" y="166" font-size="10.5" fill="#93a4b3">Relation networks · knowledge graph</text>
    <text x="520" y="186" font-size="10.5" fill="#93a4b3">Semantic and visual search</text>

    <rect x="504" y="218" width="232" height="108" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="520" y="244" font-size="12.5" font-weight="700" fill="#e6edf3">4. Curation platform</text>
    <text x="520" y="268" font-size="10.5" fill="#93a4b3">Curator-centred UI/UX design</text>
    <text x="520" y="288" font-size="10.5" fill="#93a4b3">Natural language search, sharing</text>
    <text x="520" y="308" font-size="10.5" fill="#93a4b3">Dual-tier cloud storage</text>
  </g>

  <path d="M736 210 L774 210" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="782" y="96" width="228" height="230" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="798" y="124" font-size="13" font-weight="700" fill="#35e0c4">Deliverables</text>
  <text x="798" y="154" font-size="11" fill="#93a4b3">Integrated intelligent</text>
  <text x="798" y="174" font-size="11" fill="#93a4b3">heritage platform</text>
  <text x="798" y="196" font-size="10.5" fill="#93a4b3">— usable directly by curators</text>
  <text x="798" y="214" font-size="10.5" fill="#93a4b3">from humanities backgrounds</text>
  <text x="798" y="248" font-size="11" fill="#93a4b3">AI data search and</text>
  <text x="798" y="268" font-size="11" fill="#93a4b3">analysis engine</text>
  <text x="798" y="290" font-size="10.5" fill="#93a4b3">— for immersive content</text>

  <path d="M1010 210 L1048 210" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="1056" y="96" width="184" height="230" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="1072" y="124" font-size="13" font-weight="700" fill="#35e0c4">Validation</text>
  <text x="1072" y="154" font-size="11" fill="#93a4b3">National Museum</text>
  <text x="1072" y="174" font-size="11" fill="#93a4b3">of Korea</text>
  <text x="1072" y="196" font-size="11" fill="#93a4b3">NIHC</text>
  <text x="1072" y="226" font-size="10.5" fill="#93a4b3">AR/VR pilot service</text>
  <text x="1072" y="246" font-size="10.5" fill="#93a4b3">Web museum content</text>
  <text x="1072" y="266" font-size="10.5" fill="#93a4b3">Visitor response tracking</text>
  <text x="1072" y="292" font-size="10.5" fill="#93a4b3">MR interpretation content</text>

  <text x="40" y="368" font-size="10.5" fill="#93a4b3">Period: Jul 2020 — Dec 2022   |   Designated Culture Technology R&amp;D project, Ministry of Culture, Sports and Tourism</text>
  <text x="40" y="390" font-size="10.5" fill="#93a4b3">Partners: ETRI · TRIC · SQI Soft · NUCH · dcarrick   |   Collaborating: National Museum of Korea · NIHC</text>
