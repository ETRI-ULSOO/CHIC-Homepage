<?xml version="1.0" encoding="UTF-8"?>
<!--
  '지능형 큐레이션 플랫폼이란?' — 재제작 (2026-08-03).
  5개 제공 정보(문화유산 애셋 / 비주얼 검색 / 사전시각화 / 관람객 추적·분석 / 저작권)는
  현행 Concept 페이지의 정의 문장에 명시된 항목을 그대로 옮긴 것이다
  (content-inventory.md §2.3). 임의 추가 없음.
-->
<svg viewBox="0 0 1280 400" width="1280" height="400" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1280" height="400" fill="#111820"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#e6edf3">지능형 큐레이션 플랫폼</text>
  <line x1="40" y1="62" x2="1240" y2="62" stroke="#223140"/>

  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7b8a"/>
    </marker>
  </defs>

  <!-- 중심: 큐레이터 -->
  <rect x="465" y="88" width="350" height="70" rx="8" fill="#0b0e11" stroke="#35e0c4"/>
  <text x="485" y="114" font-size="11" letter-spacing="0.12em" fill="#35e0c4">중심</text>
  <text x="485" y="140" font-size="13.5" font-weight="700" fill="#e6edf3">큐레이터가 의도한 체험·전시</text>

  <path d="M640 158 L640 186" stroke="#6b7b8a" stroke-width="1.5" marker-end="url(#a5)"/>

  <text x="40" y="204" font-size="11" letter-spacing="0.12em" fill="#93a4b3">인공지능 기반 맞춤형 제공 정보</text>

  <g>
    <rect x="40" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="58" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">문화유산 애셋</text>
    <text x="58" y="264" font-size="10.5" fill="#93a4b3">체험 서비스에 바로</text>
    <text x="58" y="284" font-size="10.5" fill="#93a4b3">적용 가능한 형태</text>

    <rect x="284" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="302" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">비주얼 검색</text>
    <text x="302" y="264" font-size="10.5" fill="#93a4b3">의미 기반 탐색과</text>
    <text x="302" y="284" font-size="10.5" fill="#93a4b3">연관 관계 제시</text>

    <rect x="528" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="546" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">사전시각화</text>
    <text x="546" y="264" font-size="10.5" fill="#93a4b3">전시 구성을 제작 전에</text>
    <text x="546" y="284" font-size="10.5" fill="#93a4b3">미리 확인</text>

    <rect x="772" y="212" width="228" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="790" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">관람객 추적·분석</text>
    <text x="790" y="264" font-size="10.5" fill="#93a4b3">반응 감지 기반의</text>
    <text x="790" y="284" font-size="10.5" fill="#93a4b3">인터랙티브 대응</text>

    <rect x="1016" y="212" width="224" height="96" rx="8" fill="#0b0e11" stroke="#223140"/>
    <text x="1034" y="240" font-size="12.5" font-weight="700" fill="#e6edf3">저작권</text>
    <text x="1034" y="264" font-size="10.5" fill="#93a4b3">애셋 활용 범위의</text>
    <text x="1034" y="284" font-size="10.5" fill="#93a4b3">관리</text>
  </g>

  <rect x="40" y="330" width="1200" height="46" rx="8" fill="#0b0e11" stroke="#223140"/>
  <text x="58" y="359" font-size="11" fill="#93a4b3">→ 위 정보를 맞춤형으로 제공하는 지능형 큐레이션 기술에 기반한 문화유산 플랫폼</text>
</svg>
