# 원천: CHIC 최종 성과보고서(2023-02-22) '사업화 성과 세부내역'.
# ⚠️ 보고서 원표는 23행이나 익산 미륵사지 석등(7·8행)과 대구 온라인 컨퍼런스
#    플랫폼(17·18행)이 각각 두 번 기재되어 있다. 중복을 제거한 고유 사례는 21건이다.
#
# 사용자 지시(2026-08-05)에 따라 **사례명만** 싣는다.
# 매출액·계약 상대(사업화기관명)는 대외비 성격이므로 이 파일에 담지 않는다.

