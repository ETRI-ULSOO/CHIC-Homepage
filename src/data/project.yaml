# Project 섹션 본문 — 현행 /project · /project/about 실측 (2026-08-03).
# 두 페이지는 콘텐츠가 완전히 동일했으므로 하나로 통합한다 (P-03).
# 영문은 신규 번역 (P-02) — 연구 용어 최종 표현은 검수 대상.

- id: ko
  goalLead: >-
    실감형 전통문화유산 전시/체험 콘텐츠 대중화를 위한 고품질 문화유산 애셋 구축과
    큐레이터 중심의 지능형 큐레이션 지원 기술 및 플랫폼 개발
  goals:
    - 효과적 문화유산 체험 제공을 위해 문화유산의 고품질 디지털화
    - 체험 서비스에 바로 적용할 수 있는 문화유산 애셋 변환
    - 인공지능 비주얼 검색 및 탐색 기반 큐레이션 지원 기술 및 플랫폼 개발
  scopeLead: >-
    실제 현장의 큐레이터가 지속적으로 편리하게 사용 가능한 지능형 큐레이션 플랫폼의 UI/UX를
    설계하고, 이미지, 텍스트, 동영상 및 3D 데이터를 포함하는 다양한 디지털 문화유산 데이터의
    생성 및 고품질 변환을 제공하며, 실감형 문화유산 체험서비스를 위한 인공지능 분석 및 검색에
    기반한 문화유산 애셋을 제공하는 지능형 큐레이션 플랫폼 개발
  scope:
    - >-
      기존의 확보된 디지털 데이터를 품질을 분석하고, 문화유산의 특징에 따른 획득 및 변환기술을
      개발하여 고품질의 표준화된 문화유산 디지털 데이터 생성
    - >-
      실감형 체험 콘텐츠의 문화유산 데이터 활용 활성화를 위하여 실감가시화 기술을 포함하고
      저작권 관리 기술이 접목된 문화유산 애셋 기술
    - >-
      인공지능기술을 기반으로 의미기반의 비주얼 검색을 지원하고, 문화유산들간의 연관 관계를
      자동 분석하여 제공하는 지능형 문화유산 분석 기술
    - >-
      문화유산 큐레이션을 주도하는 중앙박물관/무형유산원 큐레이터들의 요구사항을 시스템에 반영한
      문화유산 큐레이션 지원 플랫폼 및 체험 실증 서비스 기술
  outputs:
    - 인문학 전공 기반의 큐레이터가 사용 가능한 지능형 문화유산 통합 관리 플랫폼
    - 실감형 콘텐츠 제작을 위한 인공지능 기반 데이터 검색 및 분석 엔진

- id: en
  goalLead: >-
    Building high-quality cultural heritage assets and developing curator-centred intelligent
    curation technology and platform, so that immersive heritage exhibition and experience
    content can reach a wider public.
  goals:
    - High-quality digitisation of cultural heritage for effective heritage experiences
    - Conversion into heritage assets directly usable in experience services
    - Curation support technology and platform based on AI visual search and exploration
  scopeLead: >-
    Design of the UI/UX of an intelligent curation platform that on-site curators can use
    conveniently and continuously; generation and high-quality conversion of diverse digital
    heritage data including images, text, video and 3D; and delivery of heritage assets based
    on AI analysis and search for immersive heritage experience services.
  scope:
    - >-
      Analysing the quality of existing digital data and developing acquisition and conversion
      techniques suited to each heritage characteristic, producing high-quality standardised
      digital heritage data
    - >-
      Heritage asset technology combining immersive visualisation and rights management, to
      promote the use of heritage data in immersive experience content
    - >-
      Intelligent heritage analysis technology providing semantic visual search and automatic
      analysis of relations between heritage items
    - >-
      A heritage curation support platform and field-validated experience services reflecting
      the requirements of curators at the National Museum of Korea and the National Intangible
      Heritage Center
  outputs:
    - An integrated intelligent heritage management platform usable by curators from humanities backgrounds
    - An AI-based data search and analysis engine for immersive content production
