# 랜딩 도해 콘텐츠 — SVG에서 HTML로 이관 (2026-08-05).
#
# 종전에는 같은 문안이 국문 SVG와 영문 SVG에 각각 박혀 있었다(파일 2벌). 여기로 옮기면서
# 문안이 한 벌이 되었고, 그 결과 ① 반응형이 CSS로 처리되고 ② 스크린리더·검색·브라우저
# 확대가 도해 내부 텍스트에 닿는다. <img> 속 SVG는 셋 다 불가능했다 (WORKLOG M-27).
#
# 구조: stages(화살표로 이어지는 단계) → band(화살표 없는 나열) → footer.
# lines의 `- sub: ...`는 바로 위 줄의 부연이며 들여쓰기·흐린 색으로 렌더된다.
#
# 추진체계 도해는 여기 없다 — consortium.yaml의 role 필드에서 직접 생성한다(중복 금지).

- id: project-overview
  ko:
    title: CHIC 과제 개요
    stages:
      - boxes:
          - title: 원천 데이터
            accent: true
            lines:
              - 2D 이미지
              - 3D 스캔
              - 텍스트 기록
              - 동영상
              - sub: 국립중앙박물관 e-museum 아카이브
              - sub: 국립무형유산원 기록
      - label: 4대 연구 축
        cols: 2
        boxes:
          - title: 1. 데이터 획득·품질 개선
            lines:
              - 색상·노이즈·블러 개선, 초해상화
              - 로봇팔 자동 획득, 품질 가이드라인
              - 기가픽셀 2D · 초정밀 3D
          - title: 2. 문화유산 애셋 기술
            lines:
              - 2D/3D 애셋 생성·변환
              - 3D 가시화, 가상공간 전시
              - 애셋 표준 스키마 · 저작권
          - title: 3. 지능형 분석·검색
            lines:
              - 자동 분류·태깅, 개체명 인식
              - 관계 네트워크 · 지식그래프
              - 의미·비주얼 검색
          - title: 4. 큐레이션 플랫폼
            lines:
              - 큐레이터 중심 UI/UX 설계
              - 자연어 복합 검색, 애셋 공유
              - 클라우드 저장 이원화
      - boxes:
          - title: 결과물
            accent: true
            lines:
              - 지능형 문화유산 통합 관리 플랫폼
              - sub: 인문학 전공 큐레이터가 직접 사용 가능
              - AI 기반 데이터 검색·분석 엔진
              - sub: 실감형 콘텐츠 제작용
      - boxes:
          - title: 실증
            accent: true
            lines:
              - 국립중앙박물관
              - 국립무형유산원
              - sub: AR/VR 시범 서비스
              - sub: 웹 기반 박물관 콘텐츠
              - sub: 관람객 반응 감지·추적
              - sub: MR 해설·체험 콘텐츠
    footer:
      - '수행기간: 2020.07 — 2022.12 | 문화체육관광부 문화기술 연구개발 지정과제'
      - '참여기관: ETRI · TRIC · SQI소프트 · 한국전통문화대학교 · 디캐릭 | 협력: 국립중앙박물관 · 국립무형유산원'

  en:
    title: CHIC project overview
    stages:
      - boxes:
          - title: Source data
            accent: true
            lines:
              - 2D imagery
              - 3D scans
              - Text records
              - Video
              - sub: National Museum of Korea e-museum archive
              - sub: NIHC records
      - label: Four research axes
        cols: 2
        boxes:
          - title: 1. Acquisition & quality
            lines:
              - Colour, noise, blur, super-resolution
              - Robotic acquisition, quality guidelines
              - Gigapixel 2D · ultra-precise 3D
          - title: 2. Heritage assets
            lines:
              - 2D/3D asset generation, conversion
              - 3D visualisation, virtual exhibition
              - Asset schema · rights management
          - title: 3. Analysis & search
            lines:
              - Auto classification, tagging, NER
              - Relation networks · knowledge graph
              - Semantic and visual search
          - title: 4. Curation platform
            lines:
              - Curator-centred UI/UX design
              - Natural language search, sharing
              - Dual-tier cloud storage
      - boxes:
          - title: Deliverables
            accent: true
            lines:
              - Integrated intelligent heritage platform
              - sub: usable directly by curators from humanities backgrounds
              - AI data search and analysis engine
              - sub: for immersive content production
      - boxes:
          - title: Validation
            accent: true
            lines:
              - National Museum of Korea
              - National Intangible Heritage Center
              - sub: AR/VR pilot service
              - sub: Web museum content
              - sub: Visitor response tracking
              - sub: MR interpretation content
    footer:
      - 'Period: Jul 2020 — Dec 2022 | Designated Culture Technology R&D project, Ministry of Culture, Sports and Tourism'
      - 'Partners: ETRI · TRIC · SQI Soft · NUCH · dcarrick | Collaborating: National Museum of Korea · NIHC'

- id: necessity
  ko:
    title: CHIC 연구개발의 필요성
    stages:
      - boxes:
          - title: 현황 및 문제점
            accent: true
            lines:
              - 문화유산 디지털 데이터의 품질 편차와 표준 부재
              - 취득자 숙련도에 따른 결과물 차이 발생
              - 큐레이터가 직접 활용 가능한 도구의 부재
              - 실감콘텐츠 제작 시 애셋 재활용률 저조
      - boxes:
          - title: 기술적 요구
            accent: true
            lines:
              - 고품질 2D/3D 문화유산 데이터 획득·변환
              - AI 기반 의미·비주얼 검색 및 관계 분석
              - 애셋 표준 스키마 및 저작권 관리
              - 큐레이터 중심 UI/UX의 통합 플랫폼
      - boxes:
          - title: 기대 성과
            accent: true
            lines:
              - 지능형 문화유산 통합 관리 플랫폼 확보
              - 실감형 체험콘텐츠 제작 기간·비용 절감
              - 박물관·미술관 콘텐츠 진흥 기여
              - 타 산업(의류·미디어) 확산 가능성
    band:
      title: CHIC 연구개발 체계
      boxes:
        - title: 1. 문화유산 디지털 데이터 획득 및 품질 개선
        - title: 2. 문화유산 애셋 기술 (생성·변환·가시화·표준)
        - title: 3. 지능형 분석·검색 가시화 기술
        - title: 4. 큐레이션 지원 및 서비스 플랫폼
        - title: 5. 전시·체험 실증 서비스
    footer:
      - '협력: 국립중앙박물관 · 국립무형유산원 | 수행기간: 2020.07 — 2022.12 | 문화체육관광부 문화기술 연구개발 지정과제'
      - '참여기관: ETRI · TRIC · SQI소프트 · 한국전통문화대학교 · 디캐릭'

  en:
    title: Why CHIC was needed
    stages:
      - boxes:
          - title: Problems
            accent: true
            lines:
              - Uneven quality and no standard for digital heritage data
              - Results vary with the operator's skill
              - No tool curators can use directly
              - Low asset reuse in immersive content production
      - boxes:
          - title: Technical requirements
            accent: true
            lines:
              - High-quality 2D/3D acquisition and conversion
              - AI semantic and visual search, relation analysis
              - Asset schema standards and rights management
              - An integrated, curator-centred UI/UX
      - boxes:
          - title: Expected outcomes
            accent: true
            lines:
              - An integrated intelligent heritage platform
              - Less time and cost for immersive content
              - Support for museum and gallery content
              - Transfer to other industries (fashion, media)
    band:
      title: CHIC research structure
      boxes:
        - title: 1. Data acquisition and quality improvement
        - title: 2. Heritage asset technology (generate, convert, visualise)
        - title: 3. Intelligent analysis and search
        - title: 4. Curation support and service platform
        - title: 5. Exhibition and experience validation
    footer:
      - 'Collaborating: National Museum of Korea · National Intangible Heritage Center | Period: Jul 2020 — Dec 2022 | MCST Culture Technology R&D'
      - 'Partners: ETRI · TRIC · SQI Soft · NUCH · dcarrick'

# ── Concept 4점 중 흐름형 3점 (2026-08-05 재구축) ────────────────────────────────
# 대조형인 concept-strategy는 구조가 달라 comparisons.yaml에 있다.

- id: concept-process
  ko:
    title: 실감콘텐츠 전시 프로세스
    stages:
      - boxes: [{ eyebrow: STEP 1, title: 데이터 획득, lines: [2D 기가픽셀 · 3D 스캔, 로봇팔 자동 획득] }]
      - boxes: [{ eyebrow: STEP 2, title: 품질 개선, lines: [색상·노이즈·블러 개선, AI 초해상화] }]
      - boxes: [{ eyebrow: STEP 3, title: 애셋화, lines: [2D/3D 애셋 생성·변환, 표준 스키마 · 저작권] }]
      - boxes: [{ eyebrow: STEP 4, title: 분석·검색, lines: [자동 태깅 · 관계 분석, 의미·비주얼 검색] }]
      - boxes: [{ eyebrow: STEP 5, title: 전시·체험, accent: true, lines: [AR/VR · 웹 콘텐츠, 관람객 반응 추적] }]
    note:
      eyebrow: 전 단계 관통
      text: 지능형 큐레이션 플랫폼 — 큐레이터가 각 단계의 결과를 직접 관리·검색·활용한다
  en:
    title: Immersive content exhibition process
    stages:
      - boxes: [{ eyebrow: STEP 1, title: Acquisition, lines: [Gigapixel 2D · 3D scanning, Robotic arm capture] }]
      - boxes: [{ eyebrow: STEP 2, title: Quality improvement, lines: ['Colour, noise, deblurring', AI super-resolution] }]
      - boxes: [{ eyebrow: STEP 3, title: Asset conversion, lines: [2D/3D asset generation, Schema · rights management] }]
      - boxes: [{ eyebrow: STEP 4, title: Analysis & search, lines: [Auto tagging · relation analysis, Semantic and visual search] }]
      - boxes: [{ eyebrow: STEP 5, title: Exhibition, accent: true, lines: [AR/VR · web content, Visitor response tracking] }]
    note:
      eyebrow: Across all stages
      text: The intelligent curation platform — curators manage, search and reuse the output of each stage directly

- id: concept-platform
  ko:
    title: 지능형 큐레이션 플랫폼
    flow: column
    stages:
      - label: 중심
        boxes: [{ title: 큐레이터가 의도한 체험·전시, accent: true }]
      - label: 인공지능 기반 맞춤형 제공 정보
        cols: 5
        boxes:
          - { title: 문화유산 애셋, lines: [체험 서비스에 바로 적용 가능한 형태] }
          - { title: 비주얼 검색, lines: [의미 기반 탐색과 연관 관계 제시] }
          - { title: 사전시각화, lines: [전시 구성을 제작 전에 미리 확인] }
          - { title: 관람객 추적·분석, lines: [반응 감지 기반의 인터랙티브 대응] }
          - { title: 저작권, lines: [애셋 활용 범위의 관리] }
    note:
      text: 위 정보를 맞춤형으로 제공하는 지능형 큐레이션 기술에 기반한 문화유산 플랫폼
  en:
    title: Intelligent curation platform
    flow: column
    stages:
      - label: At the centre
        boxes: [{ title: The experience the curator intends, accent: true }]
      - label: Tailored information delivered by AI
        cols: 5
        boxes:
          - { title: Heritage assets, lines: [In a form usable directly in experience services] }
          - { title: Visual search, lines: [Semantic exploration and related-item suggestions] }
          - { title: Previsualisation, lines: [Check the exhibition layout before production] }
          - { title: Visitor tracking, lines: [Interactive response based on detected reactions] }
          - { title: Rights, lines: [Management of how far each asset may be used] }
    note:
      text: A heritage platform built on intelligent curation technology that delivers the above as tailored information

- id: concept-asset
  ko:
    title: 문화유산 애셋
    stages:
      - boxes:
          - eyebrow: 원본 데이터
            title: 디지털 문화유산
            lines: [고해상도 2D 이미지, 초정밀 3D 모델, 텍스트 기록 · 동영상]
      - boxes:
          - eyebrow: 애셋화
            title: 표준 스키마를 갖춘 재사용 단위로 변환
            accent: true
            lines:
              - 2D/3D 애셋 생성·변환
              - 3D 가시화 · 랜더링
              - 애셋 표준 스키마 정의
              - 저작권 관리 정보 결합
      - boxes:
          - eyebrow: 활용
            title: 전시 · 교육 · 콘텐츠
            lines: [가상공간 전시 자동 생성, AR/VR · 웹 콘텐츠, 교육 자료 제작]
    note:
      eyebrow: 핵심
      text: 애셋은 한 번 만들어 여러 서비스에 재사용된다 — 실증 기준 177점 취득 → 129점 애셋화, 아카이브 8,353장 디지털화
  en:
    title: Cultural heritage assets
    stages:
      - boxes:
          - eyebrow: Source data
            title: Digital heritage
            lines: [High-resolution 2D imagery, Ultra-precise 3D models, Text records · video]
      - boxes:
          - eyebrow: Asset conversion
            title: Into reusable units with a standard schema
            accent: true
            lines:
              - 2D/3D asset generation and conversion
              - 3D visualisation and rendering
              - Asset schema definition
              - Rights management data attached
      - boxes:
          - eyebrow: Use
            title: Exhibition · education
            lines: [Automatic virtual exhibitions, AR/VR and web content, Educational materials]
    note:
      eyebrow: The point
      text: An asset is made once and reused across services — 177 items acquired → 129 turned into assets, 8,353 archive sheets digitised
